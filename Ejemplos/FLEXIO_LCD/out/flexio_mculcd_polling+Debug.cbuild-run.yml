cbuild-run:
  generated-by: csolution version 2.13.0+p3-g40b6564e
  solution: ../flexio_mculcd_polling.csolution.yml
  target-type: Debug
  target-set: <default>
  compiler: AC6
  board: NXP::FRDM-MCXA156
  board-pack: NXP::FRDM-MCXA156_BSP@25.12.00
  device: NXP::MCXA156VLL
  device-pack: NXP::MCXA156_DFP@25.12.00
  output:
    - file: flexio_mculcd_polling/Debug/flexio_mculcd_polling.axf
      info: generate by flexio_mculcd_polling+Debug
      type: elf
      load: image+symbols
  system-resources:
    memory:
      - name: BootROM
        access: rx
        start: 0x03000000
        size: 0x00002000
        from-pack: NXP::MCXA156_DFP@25.12.00
      - name: PROGRAM_FLASH
        access: rx
        start: 0x00000000
        size: 0x00100000
        from-pack: NXP::MCXA156_DFP@25.12.00
      - name: SRAM
        access: rw
        start: 0x20000000
        size: 0x0001E000
        from-pack: NXP::MCXA156_DFP@25.12.00
      - name: SRAMX
        access: rw
        start: 0x04000000
        size: 0x00003000
        from-pack: NXP::MCXA156_DFP@25.12.00
  system-descriptions:
    - file: ${CMSIS_PACK_ROOT}/NXP/MCXA156_DFP/25.12.00/devices/MCXA156/MCXA156.xml
      type: svd
  debugger:
    name: CMSIS-DAP@Arm-Debugger
    protocol: swd
    clock: 5000000
    dbgconf: ../.cmsis/flexio_mculcd_polling+Debug.dbgconf
    protocol-armdbg: auto
    clock-armdbg: auto
  debug-vars:
    vars: |
      // Debug Access Variables, can be modified by user via copies of DBGCONF files as created by uVision. Also see sub-family level.
      __var SWO_Pin               = 0;                    // Serial Wire Output pin: 0 = P0_2
      __var Dbg_CR                = 0x00000000;           // DBG_CR
      __var BootTime              = 300000;               // 300 milliseconds
  debug-sequences:
    - name: EnableTraceClk
      blocks:
        - execute: |
            __var SYSCON_NS_Base_Addr = 0x40091000;
            __var TRACECLKSEL_Addr    = SYSCON_NS_Base_Addr + 0x190;
            __var TRACECLKDIV_Addr    = SYSCON_NS_Base_Addr + 0x194;
            __var AHBRESETSET1_Addr   = SYSCON_NS_Base_Addr + 0x14;
            __var AHBCLKCTRLSET1_Addr = SYSCON_NS_Base_Addr + 0x54;
            __var clksel              = 0;
            __var clkdiv              = 0;
        - if: __traceout & 0x3
          blocks:
            - execute: |
                clksel = Read32(TRACECLKSEL_Addr);  // Read current TRACECLKSEL value
            - info: Trace (TPIU) Clock not selected?
              if: clksel > 2
              execute: |
                Write32(TRACECLKSEL_Addr, 0x0);   // Select Trace divided clock
            - execute: |
                clkdiv = (Read32(TRACECLKDIV_Addr) & 0xFF);  // Read current TRACECLKDIV value, preserve divider but clear rest to enable
                Write32(TRACECLKDIV_Addr, clkdiv);

                Write32(AHBRESETSET1_Addr, (1 << 7));     // Release Port0 from reset
                Write32(AHBCLKCTRLSET1_Addr, (1 << 7));   // Enable Port0 clock
    - name: EnableDebugMailbox
      blocks:
        - if: "!(ReadAP(0x0) & 0x40)"
          execute: |
            __var status=0x55aa;
            Message(0, "MCX connect script start");

            // Read APIDR
            __dp = 0;
            __ap = 1;
            status = ReadAP(0xFC);
            Message(0, "APIDR: 0x%08X", status);

            // Read DPIDR
            __dp = 0;
            __ap = 1;
            status = ReadDP(0x0);
            Message(0, "DPIDR: 0x%08X", status);

            // Active DebugMailbox
            __dp = 0;
            __ap = 1;
            WriteAP(0x0, 0x00000021);
            DAP_Delay(30000);
            ReadAP(0x0);

            // Enter Debug Session
            __dp = 0;
            __ap = 1;
            WriteAP(0x4, 0x00000007);
            DAP_Delay(30000);
            ReadAP(0x8);

            __dp = 0;
            __ap = 0;

            Message(0, "MCX connect script end");
    - name: DebugPortStart
      blocks:
        - execute: |
            __var SW_DP_ABORT  = 0x0;
            __var DP_CTRL_STAT = 0x4;
            __var DP_SELECT    = 0x8;
            __var powered_down = 0;
            // Switch to DP Register Bank 0
            WriteDP(DP_SELECT, 0x00000000);

            // Read DP CTRL/STAT Register and check if CSYSPWRUPACK and CDBGPWRUPACK bits are set
            powered_down = ((ReadDP(DP_CTRL_STAT) & 0xA0000000) != 0xA0000000);
        - if: powered_down
          blocks:
            - execute: |
                // Request Debug/System Power-Up
                WriteDP(DP_CTRL_STAT, 0x50000000);
            - while: (ReadDP(DP_CTRL_STAT) & 0xA0000000) != 0xA0000000
              timeout: 1000000
            - if: (__protocol & 0xFFFF) == 1
              execute: |
                // Init AP Transfer Mode, Transaction Counter, and Lane Mask (Normal Transfer Mode, Include all Byte Lanes)
                // Additionally clear STICKYORUN, STICKYCMP, and STICKYERR bits by writing '1'
                WriteDP(DP_CTRL_STAT, 0x50000F32);

                Sequence("EnableDebugMailbox");
            - if: (__protocol & 0xFFFF) == 2
              execute: |
                // Init AP Transfer Mode, Transaction Counter, and Lane Mask (Normal Transfer Mode, Include all Byte Lanes)
                WriteDP(DP_CTRL_STAT, 0x50000F00);

                // Clear WDATAERR, STICKYORUN, STICKYCMP, and STICKYERR bits of CTRL/STAT Register by write to ABORT register
                WriteDP(SW_DP_ABORT, 0x0000001E);

                Sequence("EnableDebugMailbox");
            - execute: |
                __var SYSCON_NS_Base_Addr = 0x40091000;
                __var TRACECLKSEL_Addr    = SYSCON_NS_Base_Addr + 0x190;
                __var TRACECLKDIV_Addr    = SYSCON_NS_Base_Addr + 0x194;

                // config trace clock source and divide
                Write32(TRACECLKSEL_Addr, 0x0);
                Write32(TRACECLKDIV_Addr, 0x2);
    - name: WaitForStopAfterReset
      blocks:
        - execute: |
            __var SCS_Addr    = 0xE000E000;
            __var DHCSR_Addr  = SCS_Addr + 0xDF0;
            __var DFSR_Addr  = SCS_Addr + 0xD30;
            DAP_Delay(100000);  // Give bootloader time to do what it needs to do
            Sequence("EnableDebugMailbox");
            WriteDP(0x0, 0x0000001E);// Clear WDATAERR, STICKYORUN, STICKYCMP, and STICKYERR bits
            Write32(DHCSR_Addr, 0xA05F0003);  // Halt the core in case it didn't stop at a breakpiont.
            // Clear watch point
            Write32(0xE0001020, 0x0);
            Write32(0xE0001028, 0x0);
            Write32(0xE0001030, 0x0);
            Write32(0xE0001038, 0x0);

            // Clear XPSR to avoid undefined instruction fault caused by IT/ICI
            Write32(0xE000EDF8, 0x01000000);
            Write32(0xE000EDF4, 0x00010010);
            // Set MSPLIM to 0
            Write32(0xE000EDF8, 0x00000000);
            Write32(0xE000EDF4, 0x0001001C);
        - while: (Read32(DHCSR_Addr) & 0x02000000)
          timeout: 500000
        - if: (Read32(DHCSR_Addr) & 0x00020000) == 0
          execute: |
            Write32(DHCSR_Addr, 0xA05F0003);  // Force halt until finding a proper catch. Probably works better from flash.
    - name: ResetHardware
      blocks:
        - execute: |
            __var nReset      = 0x80;
            __var canReadPins = 0;
            __var SCS_Addr    = 0xE000E000;
            __var DHCSR_Addr  = SCS_Addr + 0xDF0;
            __var DEMCR_Addr  = SCS_Addr + 0xDFC;
            __var tmp;

            //Halt the core
            Write32(DHCSR_Addr, 0xA05F0003);
            //clear VECTOR CATCH and set TRCENA
            tmp = Read32(DEMCR_Addr);
            Write32(DEMCR_Addr, tmp | 0x1000000);
            __errorcontrol = 1;

            //// // Set watch point at SYSCON_BASE + 0x40 access
            //// Write32(0xE0001020, 0x4009123C);
            //// Write32(0xE0001028, 0x00000814);

            // Set watch point
            Write32(0xE0001020, 0x00000000);
            Write32(0xE0001028, 0xF0000412);
            Write32(0xE0001030, 0x000FFFFF);
            Write32(0xE0001038, 0xF0000403);

            // De-assert nRESET line
            canReadPins = (DAP_SWJ_Pins(0x00, nReset, 0) != 0xFFFFFFFF);
        - while: 1
          timeout: 50000
        - if: canReadPins
          blocks:
            - while: (DAP_SWJ_Pins(nReset, nReset, 0) & nReset) == 0
              timeout: 1000000
        - if: "!canReadPins"
          blocks:
            - execute: |
                // Assert nRESET line
                DAP_SWJ_Pins(nReset, nReset, 0);
            - while: 1
              timeout: 100000
        - if: (__connection & (1 << 17)) == 0
          execute: |
            Sequence("WaitForStopAfterReset");
            __errorcontrol = 0;
    - name: ResetSystem
      blocks:
        - execute: |
            __dp = 0;
            __ap = 0;
            // System Control Space (SCS) offset as defined in Armv6-M/Armv7-M.
            __var SCS_Addr   = 0xE000E000;
            __var AIRCR_Addr = SCS_Addr + 0xD0C;
            __var DHCSR_Addr = SCS_Addr + 0xDF0;
            __var DEMCR_Addr = SCS_Addr + 0xDFC;
            __var tmp;
            //Halt the core
            Write32(DHCSR_Addr, 0xA05F0003);
            //clear VECTOR CATCH and set TRCENA
            tmp = Read32(DEMCR_Addr);
            Write32(DEMCR_Addr, tmp | 0x1000000);

            //// // Set watch point at SYSCON_BASE + 0x40 access
            //// Write32(0xE0001020, 0x4009123C);
            //// Write32(0xE0001028, 0x00000814);

            // Set watch point
            Write32(0xE0001020, 0x00000000);
            Write32(0xE0001028, 0xF0000412);
            Write32(0xE0001030, 0x000FFFFF);
            Write32(0xE0001038, 0xF0000403);

            __errorcontrol = 1;
            // Execute SYSRESETREQ via AIRCR
            Write32(AIRCR_Addr, 0x05FA0004);
            Sequence("WaitForStopAfterReset");
            __errorcontrol = 0;
    - name: ResetProcessor
    - name: TraceStart
      blocks:
        - info: SWO Trace output selected
          if: __traceout & 0x1
          blocks:
            - execute: |
                Sequence("EnableTraceClk");       // Enable and configure trace clock
            - info: SWO via PIO0_2
              if: SWO_Pin == 0
              execute: |
                Write32(0x400BC088, 0x00001140); // PIO0_2 PORT0_PCR2 mux to SWO
  programming:
    - algorithm: ${CMSIS_PACK_ROOT}/NXP/MCXA156_DFP/25.12.00/devices/MCXA156/arm/MCXA15X_1024.FLM
      start: 0x00000000
      size: 0x00100000
      ram-start: 0x20000000
      ram-size: 0x00001000
  debug-topology:
    swj: true

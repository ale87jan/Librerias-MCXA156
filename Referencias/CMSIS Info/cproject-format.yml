# The project: node is the start of a *.cproject.yml file and can contain the following options.
# All options are optional except for the groups node, which is required.

project:
  # OPTIONAL NODES
  description:        # Brief description text of this project.
  output:             # Configure the generated output files.
  generators:         # Control the directory structure for generator output.
  rte:                # Control the directory structure for RTE (run-time environment) files.
  packs:              # Defines packs that are required for this project.
  language-C:         # Set the language standard for C source file compilation.
  language-CPP:       # Set the language standard for C++ source file compilation.
  optimize:           # Optimize level for code generation.
  link-time-optimize: # Enable optimization at linker level.
  linker:             # Instructions for the linker.
  debug:              # Generation of debug information.
  define:             # Define symbol settings for C/C++ code generation.
  define-asm:         # Define symbol settings for Assembler code generation.
  undefine:           # Remove preprocessor (#define) symbols.
  add-path:           # Additional include file paths.
  del-path:           # Remove specific include file paths.
  misc:               # Literal tool-specific controls.
  device:             # Specify processor core.
  processor:          # Processor specific settings.
  setups:             # Configurations specific to a compiler, target-type, and/or built-type.
  components:         # List of software components used.
  layers:             # List of software layers that belong to the project.
  connections:        # List of consumed and provided resources.
  executes:           # Additional pre or post build steps using external tools.

  # REQUIRED NODES
  groups:             # List of source file groups along with source files.
